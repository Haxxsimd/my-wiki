site_name: My Wiki
site_url: https://Haxxsimd.github.io/my-wiki/
repo_url: https://github.com/Haxxsimd/my-wiki
edit_uri: blob/master/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - tags:
      tags_file: tags.md
  - roamlinks

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist
  - pymdownx.emoji
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Haxxsimd

nav:
  - Home: index.md
  - Getting Started:
    - How It Works: getting-started/setup.md
    - Adding Content: getting-started/workflow.md
  - Hardware:
    - Inventory: hardware/index.md
    - X370 Main Rig: hardware/desktop-x370.md
    - X79 Server: hardware/desktop-x79.md
    - B550 Build: hardware/b550-build.md
    - Laptops: hardware/laptops.md
    - Phones: hardware/phones-tablets.md
    - Audio & TV: hardware/audio-tv.md
    - Microcontrollers & Tools: hardware/microcontrollers.md
    - E-Scooter: hardware/scooter.md
    - Salvage & Repairs: hardware/salvage-pcbs.md
    - Home Network: hardware/network.md
    - Photo Gallery: hardware/gallery.md
  - Homelab:
    - Roadmap: homelab/roadmap.md
  - Projects:
    - Hobbyverksamhet: projects/hobbyverksamhet.md
  - Tags: tags.md
